  <style>
    /* BỐ CỤC TOÀN MÀN HÌNH RỘNG RÃI & HIỆN ĐẠI */
    body {
      background-color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #0f172a;
      margin: 0;
      padding: 0;
    }

    .standalone-header {
      background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
      color: #ffffff;
      padding: 0.75rem 2rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .standalone-header-inner {
      max-width: 1720px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .standalone-brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      text-decoration: none;
      color: #ffffff;
    }

    .standalone-brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #db2777, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(219, 39, 119, 0.4);
    }

    .standalone-brand-title {
      font-size: 1.05rem;
      font-weight: 800;
      font-family: 'Nunito', sans-serif;
      letter-spacing: 0.02em;
      margin: 0;
    }

    .standalone-brand-subtitle {
      font-size: 0.76rem;
      color: #93c5fd;
      margin: 0;
    }

    .standalone-actions {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .standalone-main {
      flex: 1;
      max-width: 1720px;
      width: 100%;
      margin: 1.25rem auto;
      padding: 0 1.5rem 2.5rem 1.5rem;
      box-sizing: border-box;
    }

    /* BỐ CỤC LƯỚI KHÔNG GIAN RỘNG */
    .ai-layout-container {
      display: grid !important;
      grid-template-columns: 420px 1fr !important;
      gap: 1.5rem !important;
      align-items: start !important;
    }

    @media (max-width: 1180px) {
      .ai-layout-container {
        grid-template-columns: 1fr !important;
      }
    }

    /* STYLE CHO KHU VỰC TẢI TÀI LIỆU & GÓP Ý AI */
    .upload-dropzone {
      border: 2px dashed #cbd5e1;
      border-radius: var(--radius-sm);
      background: #f8fafc;
      padding: 1.25rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .upload-dropzone:hover, .upload-dropzone.dragover {
      border-color: #db2777;
      background: #fdf2f8;
    }
    .upload-tab-btn {
      flex: 1;
      padding: 0.45rem 0.5rem;
      font-size: 0.78rem;
      font-weight: 700;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s;
    }
    .upload-tab-btn.active {
      background: #db2777;
      color: #ffffff;
      border-color: #db2777;
    }
    .ai-feedback-box {
      background: linear-gradient(135deg, #fdf2f8 0%, #f3e8ff 100%);
      border: 1px solid #f0abfc;
      border-radius: var(--radius-md);
      padding: 1rem 1.25rem;
      margin-top: 1rem;
    }
    .editable-plan-input {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 0.35rem 0.5rem;
      font-size: 0.8rem;
      font-family: inherit;
      background: #ffffff;
      transition: border 0.2s;
    }
    .editable-plan-input:focus {
      border-color: #db2777;
      outline: none;
      box-shadow: 0 0 0 2px rgba(219, 39, 119, 0.15);
    }
    .stepper-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 0.75rem 1.5rem;
      box-shadow: var(--shadow-sm);
    }
    .step-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.84rem;
      font-weight: 700;
      color: #94a3b8;
    }
    .step-item.active {
      color: #db2777;
    }
    .step-item.completed {
      color: #16a34a;
    }
    .step-number {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #e2e8f0;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 800;
    }
    .step-item.active .step-number {
      background: #db2777;
      color: #ffffff;
    }
    .step-item.completed .step-number {
      background: #16a34a;
      color: #ffffff;
    }
    .step-line {
      flex: 1;
      height: 2px;
      background: #e2e8f0;
      margin: 0 1rem;
    }
    .step-line.active {
      background: #16a34a;
    }
  </style>
</head>

  <script>
    function ensureIntegrationRendered() {
      var container = document.getElementById("content-container");
      if (container && container.children.length === 0 && typeof renderAiIntegrationView === "function") {
        renderAiIntegrationView(container);
      }
    }
    window.addEventListener("load", ensureIntegrationRendered);
    document.addEventListener("DOMContentLoaded", ensureIntegrationRendered);
    setTimeout(ensureIntegrationRendered, 50);
    setTimeout(ensureIntegrationRendered, 250);
